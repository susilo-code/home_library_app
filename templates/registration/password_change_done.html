{% extends "base.html" %}

{% block title %}Kata Sandi Diubah — Hirunaza's Library{% endblock %}

{% block content %}
<div class="mx-auto max-w-md animate-in">
    <div class="card">
        <div class="card-body py-12 text-center">
            <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-green-100 dark:bg-green-900/30">
                <svg class="h-10 w-10 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <h1 class="mb-2 font-display text-2xl font-bold text-purple-800 dark:text-purple-200">Kata Sandi Berhasil Diubah</h1>
            <p class="mb-8 text-purple-500 dark:text-purple-400">
                Kata sandi akun Anda telah diperbarui. Gunakan kata sandi baru pada login berikutnya.
            </p>
            <div class="flex flex-col justify-center gap-3 sm:flex-row">
                <a href="{% url 'dashboard' %}" class="btn-primary">Kembali ke Dashboard</a>
                <a href="{% url 'settings' %}#akun" class="btn-secondary">Buka Pengaturan</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
